<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Counterfactual Worlds · Model studio</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#101c23;color:#f2ece0;font:16px/1.5 system-ui,sans-serif}main{display:grid;grid-template-columns:260px 1fr;height:100dvh}aside{padding:24px 16px;border-right:1px solid #30414b;overflow:auto}h1{font-size:22px;line-height:1.2;margin:8px 0 20px}p{color:#bac7ca}small{font-size:14px;color:#adc0c4}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:#78c3b8;font-size:12px}button,select,a{font:inherit}button,select{padding:9px 13px;background:#22353e;border:1px solid #49616a;border-radius:8px;color:inherit;cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ead195;outline-offset:3px}button:hover{background:#34505b}button[aria-pressed=true]{background:#6ac1ad;color:#102521;border-color:#9ad6c7}#assets{display:grid;gap:6px}#assets button{text-align:left;border-color:transparent;background:transparent;font-size:15px}#assets button[aria-current=true]{background:#29454a;border-color:#538b86}#assets span{display:block;font-size:12px;color:#9bb2b6}section{position:relative;min-width:0;display:flex;flex-direction:column}header{padding:22px 28px 12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h2{margin:0;font-size:26px;font-weight:550}#stage{flex:1;min-height:240px;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;outline:none}#notice{position:absolute;inset:40% 10% auto;text-align:center;pointer-events:none;color:#e9dcbc}footer{padding:16px 28px 22px;background:#13232c;border-top:1px solid #30414b}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools label{display:flex;gap:8px;align-items:center}#meta{margin:12px 0 5px;font-variant-numeric:tabular-nums}a{color:#b6dfd3;text-decoration-thickness:1px;text-underline-offset:4px}#status{color:#bccec9}#credit{font-size:14px;margin:10px 0 0}#group{width:100%;margin:0 0 16px}@media(max-width:700px){main{grid-template-columns:1fr;height:auto;min-height:100dvh}aside{padding:16px;border-right:0;border-bottom:1px solid #30414b}h1{font-size:20px;margin:4px 0 12px}#assets{display:flex;overflow-x:auto}#assets button{min-width:145px}#group{max-width:240px}section{height:75dvh}header,footer{padding:14px 16px}h2{font-size:22px}}
    aside,section{min-height:0}header,footer{flex-shrink:0}#stage{min-height:0}section{overflow:hidden}
  </style>
  <script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head>
<body><main>
  <aside><div class="eyebrow">Counterfactual Worlds</div><h1>Model studio</h1><label for="group" class="sr">Asset collection</label><select id="group"><option value="all">All collections</option></select><nav id="assets" aria-label="Models"></nav></aside>
  <section aria-label="Model preview"><header><div><small id="pack">Loading collection…</small><h2 id="title">Preparing model</h2></div><a id="download" download>Download GLB ↗</a></header>
  <div id="stage"><div id="notice" role="status">Loading…</div></div>
  <footer><div class="tools"><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="back">Back</button><button data-view="threequarter">Three-quarter</button><label>Pose <select id="animation"><option value="">Still</option></select></label><button id="spin" aria-pressed="false">Turntable</button></div><p id="meta"></p><small id="status">Drag to orbit · scroll to zoom</small><p id="credit">Original interpretive teaching assets · MIT · scenery and role-play, not primary evidence</p></footer>
  </section>
</main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id),stage=$('stage'),notice=$('notice');
let renderer,scene,camera,controls,model,mixer,clips=[],selected,sequence=0,radius=2,center=new THREE.Vector3(),raf=0,last=performance.now();
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let spinning=false;
function dispose(root){const geometries=new Set(),materials=new Set(),textures=new Set();root?.traverse(o=>{if(o.isMesh){geometries.add(o.geometry);for(const m of Array.isArray(o.material)?o.material:[o.material]){materials.add(m);for(const value of Object.values(m))if(value?.isTexture)textures.add(value);}}});geometries.forEach(g=>g.dispose());materials.forEach(m=>m.dispose());textures.forEach(t=>t.dispose());}
function viewpoint(view='threequarter'){const direction={front:[0,.12,1],side:[1,.12,0],back:[0,.12,-1],threequarter:[.6,.3,1]}[view];camera.position.copy(center).addScaledVector(new THREE.Vector3(...direction).normalize(),radius);controls.target.copy(center);controls.update();}
function pose(){if(!mixer)return;mixer.stopAllAction();const clip=clips.find(c=>c.name===$('animation').value);if(clip){const action=mixer.clipAction(clip);action.reset().play();if(reduced.matches){mixer.timeScale=1;mixer.setTime(clip.duration/2);mixer.timeScale=0;}else mixer.timeScale=1;}}
async function show(asset){const revision=++sequence;selected=asset.id;document.querySelectorAll('#assets button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===asset.id)));notice.textContent='Loading '+asset.title+'…';$('title').textContent=asset.title;$('pack').textContent=asset.pack.replaceAll('-',' ');$('download').href=asset.url;
try{const result=await new GLTFLoader().loadAsync(asset.url);if(revision!==sequence){dispose(result.scene);return;}if(model){mixer?.stopAllAction();mixer?.uncacheRoot(model);scene.remove(model);dispose(model);}model=result.scene;clips=result.animations;mixer=clips.length?new THREE.AnimationMixer(model):null;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});scene.add(model);model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model,true),size=bounds.getSize(new THREE.Vector3());bounds.getCenter(center);radius=Math.max(size.x,size.y,size.z)*2.2;controls.minDistance=radius*.25;controls.maxDistance=radius*4;viewpoint();$('animation').replaceChildren(new Option('Still',''),...clips.map(c=>new Option(c.name,c.name)));$('animation').disabled=!clips.length;let triangles=0,primitives=0;model.traverse(o=>{if(o.isMesh){triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;primitives++;}});$('meta').textContent=`${triangles.toLocaleString()} triangles · ${primitives} materials · ${(asset.bytes/1000).toFixed(0)} KB · ${size.toArray().map(v=>v.toFixed(2)).join(' × ')} m`;notice.textContent='';$('status').textContent='Loaded · drag to orbit · scroll to zoom';$('status').dataset.asset=asset.id;history.replaceState(null,'','?asset='+encodeURIComponent(asset.id));}
catch(error){if(revision===sequence){notice.textContent='Could not load this model. Select it again to retry.';$('status').textContent=String(error.message);}}}
try{
renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;stage.prepend(renderer.domElement);renderer.domElement.tabIndex=0;renderer.domElement.setAttribute('aria-label','3D model: drag to orbit, scroll to zoom, or use the view buttons');
scene=new THREE.Scene();scene.background=new THREE.Color('#172b35');camera=new THREE.PerspectiveCamera(35,1,.005,200);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight('#e4f4fa','#768076',2.5));const key=new THREE.DirectionalLight('#ffedd8',3);key.position.set(-3,7,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-5,right:5,top:5,bottom:-5});key.shadow.normalBias=.02;scene.add(key);const fill=new THREE.DirectionalLight('#abcddd',1.4);fill.position.set(5,4,-3);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:'#223b44',roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-.008;floor.receiveShadow=true;scene.add(floor);
const resize=new ResizeObserver(()=>{if(stage.clientWidth<1||stage.clientHeight<1)return;renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();});resize.observe(stage);
const manifest=await fetch('/model-manifest.json').then(r=>{if(!r.ok)throw Error('Asset inventory unavailable');return r.json();});for(const pack of [...new Set(manifest.assets.map(a=>a.pack))])$('group').add(new Option(pack.replaceAll('-',' '),pack));
function list(){const assets=manifest.assets.filter(a=>$('group').value==='all'||a.pack===$('group').value);$('assets').replaceChildren(...assets.map(asset=>{const button=document.createElement('button');button.dataset.id=asset.id;button.setAttribute('aria-current',String(asset.id===selected));button.textContent=asset.title;const kind=document.createElement('span');kind.textContent=asset.category;button.append(kind);button.onclick=()=>show(asset);return button;}));}
$('group').onchange=list;list();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>viewpoint(b.dataset.view));$('animation').onchange=pose;$('spin').onclick=()=>{spinning=!spinning;$('spin').setAttribute('aria-pressed',String(spinning));};reduced.addEventListener('change',pose);
const requested=new URL(location.href).searchParams.get('asset');await show(manifest.assets.find(a=>a.id===(requested??'thaleia'))??manifest.assets[0]);
function frame(now){const dt=Math.max(0,Math.min((now-last)/1000,.05));last=now;if(!document.hidden){mixer?.update(dt);controls.autoRotate=spinning&&!reduced.matches;controls.autoRotateSpeed=1.3;controls.update(dt);renderer.render(scene,camera);}raf=requestAnimationFrame(frame);}raf=requestAnimationFrame(frame);
window.addEventListener('pagehide',()=>{sequence++;cancelAnimationFrame(raf);resize.disconnect();controls.dispose();mixer?.stopAllAction();if(model)mixer?.uncacheRoot(model);dispose(scene);renderer.dispose();},{once:true});
}catch(error){notice.textContent='3D preview is unavailable. The Blender sources and PNG previews remain in assets/blender.';$('status').textContent=String(error.message);}
</script></body></html>
